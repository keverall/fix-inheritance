name: PowerShell Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell
        uses: actions/setup-powershell@v1
        with:
          pwsh-version: '7.4'

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object FullName
          $results = Invoke-ScriptAnalyzer -Path $scripts -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSAvoidUsingInvokeExpression,PSAvoidUsingEmptyCatchBlock,PSUseShouldProcessForStateChangingF
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }